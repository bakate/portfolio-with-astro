name: External links

# Weekly check that every external link of the site still answers. Kept out of
# the PR workflow: it depends on third-party sites. When links break it opens a
# single issue labelled `broken-links`, updates it only when the report changes,
# and closes it once the links answer again.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: external-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: broken-links
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Built in its own step: a failed build fails the run without being
      # reported as broken links, and its log stays out of the issue body.
      - run: pnpm build

      # Exit code 1 means broken links; any other failure is the checker's own
      # and fails the run without touching the issue.
      - name: Check external links
        id: check
        run: |
          set +e
          node scripts/check-external-links.mjs > link-report.md
          status=$?
          cat link-report.md
          case $status in
            0) echo "broken=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "broken=true" >> "$GITHUB_OUTPUT" ;;
            *) exit $status ;;
          esac

      # The issue only changes, and only notifies, when the report does: a link
      # breaks or gets repaired. A known, unchanged report leaves it untouched.
      - name: Open or update the broken-links issue
        if: steps.check.outputs.broken == 'true'
        run: |
          fingerprint=$(sha256sum link-report.md | cut -d' ' -f1)
          marker="<!-- report-sha256: $fingerprint -->"
          {
            cat link-report.md
            echo
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
            echo
            echo "$marker"
          } > issue-body.md

          gh label create "$LABEL" --color d93f0b --description "An external link of the site is broken" --force
          issue=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number')
          if [ -z "$issue" ]; then
            gh issue create --title "Broken external links" --label "$LABEL" --body-file issue-body.md
          # Read into a variable first: under pipefail, `gh … | grep -q` can fail on SIGPIPE.
          elif current=$(gh issue view "$issue" --json body --jq .body) && grep -qF "$marker" <<< "$current"; then
            echo "::notice::Same broken links as already reported in #$issue, issue left unchanged."
            exit 0
          else
            gh issue edit "$issue" --body-file issue-body.md
            gh issue comment "$issue" --body "The broken links changed on $(date -u +%F). Report updated above."
          fi
          exit 1

      - name: Close the broken-links issue
        if: steps.check.outputs.broken == 'false'
        run: |
          issue=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Every external link answers again on $(date -u +%F)."
          fi
